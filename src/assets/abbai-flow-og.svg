<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Abbai Flow">
  <title>Abbai Flow</title>
  <!--
    Open Graph card. Deliberately text-free: the rasteriser has no font stack,
    so the mark and the brand band carry the identity instead of a wordmark.
  -->
  <defs>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12857e"/>
      <stop offset="1" stop-color="#0b5b58"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7a832"/>
      <stop offset="1" stop-color="#c9871a"/>
    </linearGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d06a4a"/>
      <stop offset="1" stop-color="#a8452c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#fbf7f1"/>
  <rect width="1200" height="630" fill="#0f6f6a" opacity="0.06"/>
  <rect x="0" y="590" width="1200" height="40" fill="#0f6f6a"/>

  <g transform="translate(112 105) scale(0.8)">
    <rect width="512" height="512" rx="116" fill="#fbf7f1"/>
    <path d="M96 300c56-56 104-56 160 0s104 56 160 0" fill="none" stroke="url(#river)" stroke-width="34" stroke-linecap="round"/>
    <path d="M96 360c56-56 104-56 160 0s104 56 160 0" fill="none" stroke="#12857e" stroke-opacity=".38" stroke-width="18" stroke-linecap="round"/>
    <g stroke="url(#gold)" stroke-width="26" stroke-linecap="square">
      <path d="M256 96v104M256 312v104M96 256h104M312 256h104"/>
    </g>
    <g stroke="url(#clay)" stroke-width="14" stroke-linecap="round">
      <path d="M200 200l40 40M312 312l-40-40M312 200l-40 40M200 312l40-40"/>
    </g>
    <circle cx="256" cy="256" r="52" fill="url(#gold)"/>
    <circle cx="256" cy="256" r="22" fill="#fbf7f1"/>
    <circle cx="256" cy="256" r="9" fill="url(#clay)"/>
  </g>

  <!-- Weave rhythm beside the mark: three currents, decreasing weight -->
  <g stroke="#0f6f6a" fill="none" stroke-linecap="round">
    <path d="M600 250c62-52 118-52 180 0s118 52 180 0" stroke-width="26"/>
    <path d="M600 330c62-52 118-52 180 0s118 52 180 0" stroke-width="18" opacity=".55"/>
    <path d="M600 400c62-52 118-52 180 0s118 52 180 0" stroke-width="12" opacity=".3"/>
  </g>
</svg>
