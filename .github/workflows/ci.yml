name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check beacon/ sync
        run: bash scripts/check-beacon-sync.sh

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # One run, not two: `test:coverage` executes every test *and* asserts the
      # thresholds, so a separate `npm test` was ~40s of identical work per run.
      # The reporters are overridden to text for CI - the html report is written
      # for a human to open and nobody opens it here.
      - name: Test & coverage
        run: npm run test:coverage -- --coverage.reporter=text --coverage.reporter=text-summary

      - name: Backend tests
        run: npm run test:server

      # `npm run build` is `tsc && vite build`, and `Type check` already ran tsc.
      - name: Build
        run: npx vite build
