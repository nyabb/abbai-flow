name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify package version exists in changelog
        run: npm run changelog:verify

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # One run, not two: `test:coverage` executes every test *and* asserts the
      # thresholds, so a separate `npm test` was ~40s of identical work per run.
      # The reporters are overridden to text for CI - the html report is written
      # for a human to open and nobody opens it here.
      - name: Test & coverage
        run: npm run test:coverage -- --coverage.reporter=text --coverage.reporter=text-summary

      - name: Backend tests
        run: npm run test:server

      # `npm run build` is `tsc && tsc -p tsconfig.scripts.json && tsc -p
      # tsconfig.server.json && vite build`; `Type check` already ran both
      # type-check configs and `Backend tests` compiles the server rules.
      - name: Build
        run: npx vite build
