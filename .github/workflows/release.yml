name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.semantic.outputs.released }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release
          # semantic-release doesn't set a step output itself; detect whether
          # it actually cut a release by checking if HEAD gained a new tag.
          if git describe --tags --exact-match HEAD >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  # semantic-release creates GitHub releases using the default GITHUB_TOKEN,
  # and GitHub deliberately does not fire downstream `release`/`push: tags`
  # workflow events for GITHUB_TOKEN-authored activity (loop prevention), so a
  # tag-triggered image build would never run. Calling the image workflow
  # directly after a release closes that gap without needing a PAT.
  docker-image:
    needs: release
    if: needs.release.outputs.released == 'true'
    uses: ./.github/workflows/docker-image.yml
    permissions:
      contents: read
      packages: write
